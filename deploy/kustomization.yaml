apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: santa
resources:
  - santa.yaml
configMapGenerator:
  - name: santa-app
    files:
      - dist/server.js
      - dist/admin.js
  - name: santa-settings
    literals:
      - SANTA_MIN_BUDGET=20
      - SANTA_CURRENCY=EUR
      - SANTA_MAX_PLAYERS=200
