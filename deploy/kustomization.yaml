apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: santa
resources:
  - santa.yaml
configMapGenerator:
  - name: santa-app
    files:
      - dist/server.js
      - dist/admin.js
  - name: santa-settings
    literals:
      - SANTA_MIN_BUDGET=20
      - SANTA_CURRENCY=EUR
      - SANTA_MAX_PLAYERS=200
      - SANTA_MAIL_DAILY_CAP=300
      # Dates shown on the public board, as YYYY-MM-DD. Leave empty until they are decided.
      # The address players reach the server at. Switches on the players' own page (/me).
      - SANTA_PUBLIC_URL=https://santa.mazarache.org
      - SANTA_JOIN_BY=
      - SANTA_DRAW_ON=
      - SANTA_REVEAL_ON=
