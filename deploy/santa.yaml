apiVersion: v1
kind: Namespace
metadata:
  name: santa
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: santa-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: santa
  labels: { app.kubernetes.io/name: santa }
spec:
  replicas: 1 # one SQLite file, one writer
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: santa }
  template:
    metadata:
      labels: { app.kubernetes.io/name: santa }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: santa
          image: oven/bun:1.3.11-alpine@sha256:7ed9f74c326d1c260abe247ac423ccbf5ac92af62bb442d515d1f92f21e8ea9b
          command: ["bun", "/app/server.js"]
          env:
            - { name: SANTA_HOST, value: "0.0.0.0" }
            - { name: SANTA_PORT, value: "8787" }
            - { name: SANTA_DB, value: /data/santa.db }
            - name: SANTA_INVITE_CODE
              valueFrom:
                secretKeyRef: { name: santa-invite, key: code, optional: true }
            # Email confirmation is on only when all three values exist.
            - name: SANTA_MAIL_ACCOUNT_ID
              valueFrom:
                secretKeyRef: { name: santa-mail, key: account_id, optional: true }
            - name: SANTA_MAIL_TOKEN
              valueFrom:
                secretKeyRef: { name: santa-mail, key: token, optional: true }
            - name: SANTA_MAIL_FROM
              valueFrom:
                secretKeyRef: { name: santa-mail, key: from, optional: true }
          envFrom:
            - configMapRef: { name: santa-settings }
          ports:
            - { name: http, containerPort: 8787 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: app
          configMap: { name: santa-app }
        - name: data
          persistentVolumeClaim: { claimName: santa-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: santa
spec:
  selector: { app.kubernetes.io/name: santa }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: santa
spec:
  ingressClassName: traefik
  rules:
    - host: santa.k3s.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: santa, port: { name: http } }
